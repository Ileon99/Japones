<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#a94332"><title>日本語 · Mis cursos</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#fff8f4;color:#302824;margin:0}header{background:#ac4734;color:white;padding:24px}header>div,main{max-width:850px;margin:auto}h1{margin:0}header p{margin:6px 0 0}.mascotte{display:flex;align-items:center;gap:14px;background:#fff0e7;border:1px solid #f1d0bf;border-radius:18px;padding:12px;margin:0 0 18px}.mascotte img{height:96px;width:96px;object-fit:contain;border-radius:16px}.mascotte strong{color:#743923}.mascotte p{color:#73635d;margin:4px 0}main{padding:20px 14px 65px}button{font:inherit;cursor:pointer;padding:11px 15px;border:1px solid #d9c9bf;background:white;border-radius:12px;color:#382c27}button:hover{border-color:#ac4734}.primary{background:#ac4734;color:white;border-color:#ac4734}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.panel{background:#fff;border:1px solid #e5d6cc;border-radius:18px;padding:20px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{text-align:left;padding:18px;min-height:130px}.muted{color:#756a65}.jp{font-size:2rem;margin:12px 0}.item{padding:14px 0;border-bottom:1px solid #f1e4dc}.item:last-child{border:0}.item p{margin:4px 0}.tag{font-size:.8rem;color:#973e2c;background:#faeee9;border-radius:30px;padding:4px 9px;display:inline-block}.choice{display:block;width:100%;text-align:left;margin:9px 0}.right{background:#ddf3e5;border-color:#2d9062}.wrong{background:#ffe3e3;border-color:#d35c56}.bar{height:8px;border-radius:10px;background:#efe3db;overflow:hidden}.fill{background:#318963;height:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}footer{max-width:850px;margin:auto;padding:12px;color:#776c66;font-size:.8rem}
</style></head><body><header><div><h1>日本語 · Japonés</h1><p>Aprende siguiendo el orden de tus cursos</p></div></header><main><nav class="tabs" id="nav"></nav><div id="app"></div></main><footer>V1: progreso guardado en este navegador. Contenido inicial revisable y ampliable al incorporar nuevos apuntes.</footer>
<script>
const sections=[
{title:"Saludos",lesson:1,type:"Expresiones",items:[
["おはようございます","ohayō gozaimasu","Buenos días (por la mañana)"],["こんにちは","konnichiwa","Hola / buenas tardes"],["こんばんは","konbanwa","Buenas noches (saludo)"],["おやすみなさい","oyasuminasai","Buenas noches (al dormir)"],["はじめまして","hajimemashite","Encantado de conocerte"],["よろしくおねがいします","yoroshiku onegaishimasu","Mucho gusto"],["ありがとう","arigatō","Gracias"],["ありがとうございます","arigatō gozaimasu","Muchas gracias"],["すみません","sumimasen","Disculpe / perdón"],["さようなら","sayōnara","Adiós"],["じゃあ、また","jā mata","Hasta luego"],["いってきます","ittekimasu","Me voy (de casa)"],["いってらっしゃい","itterasshai","Que te vaya bien"],["ただいま","tadaima","Ya estoy en casa"],["おかえりなさい","okaerinasai","Bienvenido a casa"],["いただきます","itadakimasu","Expresión antes de comer"],["ごちそうさま","gochisōsama","Expresión después de comer"]]},
{title:"En clase",lesson:1,type:"Expresiones",items:[
["はじめましょう","hajimemashō","Empecemos"],["おわりましょう","owarimashō","Terminemos"],["やすみましょう","yasumimashō","Tomemos un descanso"],["しつもん","shitsumon","Pregunta"],["れい","rei","Ejemplo"],["こたえ","kotae","Respuesta"],["しゅくだい","shukudai","Deberes"],["しけん","shiken","Examen"],["わかりますか","wakarimasu ka","¿Entiendes?"],["わかりません","wakarimasen","No entiendo"],["よんでください","yonde kudasai","Lee, por favor"],["かいてください","kaite kudasai","Escribe, por favor"],["きいてください","kiite kudasai","Escucha, por favor"],["くりかえしてください","kurikaeshite kudasai","Repite, por favor"]]},
{title:"Profesiones y presentación",lesson:1,type:"Vocabulario",items:[
["わたし","watashi","Yo"],["なまえ","namae","Nombre"],["しごと","shigoto","Trabajo"],["がくせい","gakusei","Estudiante"],["せんせい","sensei","Profesor/a (tratamiento)"],["きょうし","kyōshi","Docente (propio trabajo)"],["いしゃ","isha","Médico/a"],["かんごし","kangoshi","Enfermero/a"],["エンジニア","enjinia","Ingeniero/a"],["かいしゃいん","kaishain","Empleado/a de empresa"],["ぎんこういん","ginkōin","Empleado/a de banco"],["こうむいん","kōmuin","Funcionario/a"],["てんいん","ten'in","Dependiente/a"],["かいしゃ","kaisha","Empresa"],["がっこう","gakkō","Escuela"],["くに","kuni","País"],["びょういん","byōin","Hospital"]]},
{title:"Gramática: presentación",lesson:1,type:"Gramática",items:[
["～さん","-san","Sufijo respetuoso con nombres"],["も","mo","También (partícula)"],["わたしも がくせいです","watashi mo gakusei desu","Yo también soy estudiante"]]},
{title:"Objetos",lesson:2,type:"Vocabulario",items:[
["えんぴつ","enpitsu","Lápiz"],["かぎ","kagi","Llave"],["かさ","kasa","Paraguas"],["かばん","kaban","Bolso / mochila"],["カメラ","kamera","Cámara"],["くるま","kuruma","Coche"],["けいたいでんわ","keitai denwa","Teléfono móvil"],["さいふ","saifu","Cartera"],["ざっし","zasshi","Revista"],["じしょ","jisho","Diccionario"],["しゃしん","shashin","Fotografía"],["しんぶん","shinbun","Periódico"],["テレビ","terebi","Televisión"],["とけい","tokei","Reloj"],["ノート","nōto","Cuaderno"],["パスポート","pasupōto","Pasaporte"],["ペン","pen","Bolígrafo"],["ぼうし","bōshi","Sombrero"],["ほん","hon","Libro"]]},
{title:"La familia",lesson:2,type:"Vocabulario",items:[
["だれ","dare","Quién"],["おとうさん","otōsan","Padre (de otra persona / trato familiar)"],["ちち","chichi","Mi padre (al hablar con otros)"],["おかあさん","okāsan","Madre (de otra persona / trato familiar)"],["はは","haha","Mi madre (al hablar con otros)"],["おにいさん","onīsan","Hermano mayor (de otro / trato familiar)"],["あに","ani","Mi hermano mayor"],["おとうと","otōto","Mi hermano menor"],["おねえさん","onēsan","Hermana mayor (de otro / trato familiar)"],["あね","ane","Mi hermana mayor"],["いもうと","imōto","Mi hermana menor"],["おじいさん","ojīsan","Abuelo (de otro / trato familiar)"],["そふ","sofu","Mi abuelo"],["おばあさん","obāsan","Abuela (de otro / trato familiar)"],["そぼ","sobo","Mi abuela"],["ごしゅじん","goshujin","Marido (de otra persona)"],["しゅじん","shujin","Mi marido (forma tradicional)"],["おくさん","okusan","Esposa (de otra persona)"],["つま","tsuma","Mi esposa"]]},
{title:"Gramática: de quién",lesson:2,type:"Gramática",items:[
["このひとは だれ ですか","kono hito wa dare desu ka","¿Quién es esta persona?"],["これは だれの ペンですか","kore wa dare no pen desu ka","¿De quién es este bolígrafo?"],["これは わたしの ペンです","kore wa watashi no pen desu","Este es mi bolígrafo"],["いいえ、わたしのじゃありません","iie watashi no ja arimasen","No, no es mío"]]}
];
let stats={};try{stats=JSON.parse(localStorage.getItem("japones-v1")||"{}")}catch(e){}
let view="home",sid=0,q=0,answers=[],chosen=null,score=0;
const app=document.querySelector("#app"),nav=document.querySelector("#nav");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("japones-v1",JSON.stringify(stats))}
function go(v,i){view=v;if(i!==undefined)sid=i;render();scrollTo(0,0)}
function start(i){sid=i;view="quiz";q=0;score=0;chosen=null;answers=[...sections[i].items.keys()].sort(()=>Math.random()-.5).slice(0,10);render()}
function home(){app.innerHTML="<div class=\"mascotte\"><img src=\"mascotte.jpg\" alt=\"Petite lézarde souriante qui fait coucou\" onerror=\"this.parentElement.style.display='none'\"><div><strong>Bonjour ! こんにちは！</strong><p>Prêt pour une nouvelle aventure en japonais ?</p></div></div>"+'<h2>Mis cursos</h2><p class="muted">Empieza por el contenido que has visto en clase.</p>'+[1,2].map(l=>'<section class="panel"><h2>Curso '+l+'</h2><div class="cards">'+sections.map((s,i)=>s.lesson!==l?'':'<button class="card" data-open="'+i+'"><span class="tag">'+esc(s.type)+'</span><h3>'+esc(s.title)+'</h3><p class="muted">'+s.items.length+' elementos</p></button>').join("")+'</div></section>').join("");app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go("section",+b.dataset.open))}
function lesson(){let s=sections[sid];app.innerHTML='<button id="back">← Cursos</button><section class="panel"><span class="tag">Curso '+s.lesson+' · '+esc(s.type)+'</span><h2>'+esc(s.title)+'</h2><button class="primary" id="quiz">Practicar QCM</button>'+s.items.map(([jp,ro,fr])=>'<div class="item"><p class="jp" lang="ja">'+esc(jp)+'</p><p class="muted">'+esc(ro)+'</p><p>'+esc(fr)+'</p></div>').join("")+'</section>';document.querySelector("#back").onclick=()=>go("home");document.querySelector("#quiz").onclick=()=>start(sid)}
function quiz(){let s=sections[sid];if(q>=answers.length){app.innerHTML='<section class="panel"><h2>¡Terminado!</h2><p class="jp">'+score+' / '+answers.length+'</p><p>Revisa tus errores en la pestaña Revisión.</p><button class="primary" id="again">Repetir</button> <button id="back">Volver</button></section>';document.querySelector("#again").onclick=()=>start(sid);document.querySelector("#back").onclick=()=>go("section");return}
let idx=answers[q],v=s.items[idx],others=s.items.map((a,j)=>j).filter(j=>j!==idx).sort(()=>Math.random()-.5).slice(0,3),opts=[idx,...others].sort(()=>Math.random()-.5);
app.innerHTML='<button id="back">← Volver</button><section class="panel"><span class="tag">'+esc(s.title)+'</span><p>Pregunta '+(q+1)+' / '+answers.length+'</p><div class="bar"><div class="fill" style="width:'+100*q/answers.length+'%"></div></div><p>¿Qué significa?</p><div class="jp" lang="ja">'+esc(v[0])+'</div><p class="muted">'+esc(v[1])+'</p>'+opts.map(j=>'<button class="choice" data-option="'+j+'">'+esc(s.items[j][2])+'</button>').join("")+'<p id="feedback" aria-live="polite"></p><button id="next" class="primary" hidden>Siguiente →</button></section>';
document.querySelector("#back").onclick=()=>go("section");app.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>{if(chosen!==null)return;chosen=+b.dataset.option;let ok=chosen===idx;if(ok)score++;let k=sid+":"+idx,p=stats[k]||{seen:0,missed:0};p.seen++;if(!ok)p.missed++;p.ok=ok;stats[k]=p;save();app.querySelectorAll("[data-option]").forEach(x=>{x.disabled=true;if(+x.dataset.option===idx)x.classList.add("right");else if(x===b)x.classList.add("wrong")});document.querySelector("#feedback").textContent=ok?"¡Correcto!":"Respuesta: "+v[2];document.querySelector("#next").hidden=false});document.querySelector("#next").onclick=()=>{chosen=null;q++;render()}}
function review(){let missed=[];sections.forEach((s,i)=>s.items.forEach((v,j)=>{if(stats[i+":"+j]?.ok===false)missed.push({s,i,v})}));app.innerHTML='<h2>Revisión de errores</h2>'+(missed.length?missed.map(({s,i,v})=>'<section class="panel"><span class="tag">'+esc(s.title)+'</span><p class="jp" lang="ja">'+esc(v[0])+'</p><p>'+esc(v[2])+'</p><button data-practice="'+i+'">Practicar sección</button></section>').join(""):'<section class="panel">Aún no hay errores guardados. ¡Prueba un QCM!</section>');app.querySelectorAll("[data-practice]").forEach(b=>b.onclick=()=>start(+b.dataset.practice))}
function progress(){let attempts=Object.values(stats).reduce((n,p)=>n+(p.seen||0),0),correct=Object.values(stats).filter(p=>p.ok).length,total=sections.reduce((n,s)=>n+s.items.length,0);app.innerHTML='<h2>Mi progreso</h2><section class="panel"><h3>'+correct+' / '+total+' elementos acertados</h3><div class="bar"><div class="fill" style="width:'+100*correct/total+'%"></div></div><p>'+attempts+' respuestas registradas</p><p class="muted">Este progreso está guardado únicamente en este navegador.</p></section>'}
function render(){nav.innerHTML=[["home","Cursos"],["review","Revisión"],["progress","Progreso"]].map(([v,l])=>'<button class="'+(view===v?'primary':'')+'" data-tab="'+v+'">'+l+'</button>').join("");nav.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));if(view==="home")home();else if(view==="section")lesson();else if(view==="quiz")quiz();else if(view==="review")review();else progress()}
render();
</script></body></html>
